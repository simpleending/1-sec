name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -checks='all,-U1000,-ST1000,-ST1005,-S1007,-S1009,-S1039,-SA1019,-SA5011' ./...

      - name: Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G101 -severity=high -confidence=medium -concurrency=4 ./cmd/... ./internal/...

      - name: Test
        run: go test -race -timeout 120s ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: OSV dependency scan
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          osv-scanner scan source -r .

  rust-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: 1sec-engine-linux-amd64
            native: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: 1sec-engine-linux-arm64
            native: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: 1sec-engine-darwin-amd64
            native: true
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: 1sec-engine-darwin-arm64
            native: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: 1sec-engine-windows-amd64.exe
            native: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: 1sec-engine-windows-arm64.exe
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure MSVC cross tools (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio ARM64 build tools are not installed'
          }
          $devCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
          $environment = & $env:COMSPEC /d /s /c "`"$devCmd`" -arch=arm64 -host_arch=amd64 >nul && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=][^=]*)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/1sec-engine/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/1sec-engine/Cargo.lock', 'rust/1sec-engine/Cargo.toml') }}

      - name: Build Rust engine
        working-directory: rust/1sec-engine
        env:
          ONESEC_VERSION: ${{ github.ref_name }}
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Test (native targets only)
        if: matrix.native
        working-directory: rust/1sec-engine
        run: cargo test --no-default-features --target ${{ matrix.target }}

      - name: Rust dependency audit
        working-directory: rust/1sec-engine
        shell: bash
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          cargo audit

      - name: Rename artifact
        shell: bash
        run: |
          src="rust/1sec-engine/target/${{ matrix.target }}/release/1sec-engine"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [quality, rust-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install release trust tools
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@latest
          go install github.com/anchore/syft/cmd/syft@latest

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Go artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Download Rust artifacts
        uses: actions/download-artifact@v8
        with:
          path: rust-artifacts

      - name: Prepare Rust binaries
        run: |
          mkdir -p upload
          cp rust-artifacts/1sec-engine-linux-amd64/1sec-engine-linux-amd64 upload/
          cp rust-artifacts/1sec-engine-linux-arm64/1sec-engine-linux-arm64 upload/
          cp rust-artifacts/1sec-engine-darwin-amd64/1sec-engine-darwin-amd64 upload/
          cp rust-artifacts/1sec-engine-darwin-arm64/1sec-engine-darwin-arm64 upload/
          cp rust-artifacts/1sec-engine-windows-amd64.exe/1sec-engine-windows-amd64.exe upload/
          cp rust-artifacts/1sec-engine-windows-arm64.exe/1sec-engine-windows-arm64.exe upload/
          cd upload && sha256sum * > rust-checksums.txt

      - name: Sign Rust checksums
        run: |
          cosign sign-blob --bundle upload/rust-checksums.txt.sigstore.json upload/rust-checksums.txt --yes

      - name: Generate Rust artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: upload/*

      - name: Attach Rust binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} upload/* --clobber
