name: Publish sidecar bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release to bundle
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: sidecar-bundles-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify original release and publish bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isImmutable --jq 'if .isDraft or .isImmutable then error("Release must be published and allow additional assets") else . end'
          gh release download "$RELEASE_TAG" --dir verified-release \
            --pattern "1sec_${RELEASE_TAG#v}_*" --pattern '1sec-engine-*' \
            --pattern 'checksums.txt*' --pattern 'rust-checksums.txt*'
          cd verified-release
          for manifest in checksums.txt rust-checksums.txt; do
            cosign verify-blob --bundle "$manifest.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$manifest"
            sha256sum --check "$manifest"
          done
          cd "$GITHUB_WORKSPACE"
          python3 .github/package-sidecar-bundles.py "$RELEASE_TAG" verified-release sidecar-bundles
          cd sidecar-bundles
          manifest=sidecar-bundle-checksums.txt
          sha256sum --check "$manifest"
          cosign sign-blob --yes --bundle "$manifest.sigstore.json" "$manifest"
          cosign verify-blob --bundle "$manifest.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$manifest"
          gh release upload "$RELEASE_TAG" --clobber 1sec-with-rust_* "$manifest" "$manifest.sigstore.json"
