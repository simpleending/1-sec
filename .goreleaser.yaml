version: 2

project_name: 1sec

before:
  hooks:
    - go mod tidy

builds:
  - id: 1sec
    main: ./cmd/1sec
    binary: 1sec
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.buildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - configs/default.yaml
      - install.sh

# Rust engine is built separately via CI (see .github/workflows)
# and attached as extra release artifacts.
# Users can also build it manually: cd rust/1sec-engine && cargo build --release

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
      - "--enrich"
      - "all"
    disable: false

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: simpleending
    name: 1-sec
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
